[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherofetch"
version = "1.0.2"
description = "Deterministic 4-tier lossless music acquisition & 5-gate verification engine."
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "meet-the-1337"},
]
keywords = ["music", "downloader", "audiophile", "flac", "opus", "lyrics", "soulseek", "youtube"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "yt-dlp>=2024.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
sherofetch = "cli:main"
sherofetch-server = "backend_server:main"

[tool.setuptools]
py-modules = [
    "cli", "config_manager", "universal_resolver", "five_gate_verifier",
    "backend_server", "checkpoint4_pipeline", "match_song", "playlist_resolver",
    "path_manager", "download_cli", "search_cli",
]

[project.urls]
Homepage = "https://github.com/meet-the-1337/sherofetch"
Issues = "https://github.com/meet-the-1337/sherofetch/issues"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "network: mark test as requiring internet network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
