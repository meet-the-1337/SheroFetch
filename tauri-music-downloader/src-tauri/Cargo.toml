[package]
name = "music-downloader"
version = "1.0.2"
description = "Native Tauri Desktop Music Acquisition Engine"
authors = ["Antigravity Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
