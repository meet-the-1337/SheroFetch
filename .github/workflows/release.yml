name: Release — Build Windows & Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Frontend
        run: |
          cd tauri-music-downloader
          npm install
          npm run build

      - name: Build Native Windows Release
        run: |
          cd tauri-music-downloader/src-tauri
          cargo build --release

      - name: Stage Windows Executable
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item tauri-music-downloader/src-tauri/target/release/music-downloader.exe dist-windows/SheroFetch.exe
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-windows/SheroFetch.exe

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Frontend
        run: |
          cd tauri-music-downloader
          npm install
          npm run build

      - name: Build Native Linux Release
        run: |
          cd tauri-music-downloader/src-tauri
          cargo build --release

      - name: Stage Linux Executable
        run: |
          mkdir -p dist-linux
          cp tauri-music-downloader/src-tauri/target/release/music-downloader dist-linux/sherofetch-linux-x86_64
          chmod +x dist-linux/sherofetch-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist-linux/sherofetch-linux-x86_64

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/windows-release/SheroFetch.exe
            release-artifacts/linux-release/sherofetch-linux-x86_64
          generate_release_notes: true
