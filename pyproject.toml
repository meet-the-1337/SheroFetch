[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-music-installer"
version = "1.0.0"
description = "Deterministic sequential music library builder with 10-checkpoint validation engine."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "meet-the-1337"},
]
keywords = ["music", "library", "downloader", "musicbrainz", "metadata", "lyrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "requests>=2.31",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "flet>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
umi = "umi.__main__:main"

[project.urls]
Homepage = "https://github.com/meet-the-1337/universal-music-installer"
Issues = "https://github.com/meet-the-1337/universal-music-installer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "network: mark test as requiring internet network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
