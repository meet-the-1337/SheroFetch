name: CI — Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-python:
    name: Check Python Syntax & Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          python -m py_compile checkpoint4_pipeline.py match_song.py path_manager.py playlist_resolver.py download_cli.py search_cli.py

  check-frontend:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Assets
        run: |
          cd tauri-music-downloader
          npm install
          npm run build

  check-rust:
    name: Verify Rust Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Check
        run: |
          cd tauri-music-downloader/src-tauri
          cargo check
